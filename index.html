<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal TKA - Bahasa Indonesia SMP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .options {
            list-style-type: none;
            padding: 0;
        }
        .options li {
            background-color: #e9ecef;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .options li:hover {
            background-color: #d3d9df;
        }
        .options li.selected {
            background-color: #007bff;
            color: white;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background-color: #218838;
        }
        #result {
            display: none;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz">
    <h1>Latihan Soal TKA Seri 3</h1>
    <div class="question" id="question">Memuat pertanyaan...</div>
    <ul class="options" id="options"></ul>
    <button id="submit">Jawab</button>
</div>

<div class="quiz-container" id="result">
    <p>Skor Anda: <span id="score">0</span> / <span id="total">0</span></p>
    <button onclick="location.reload()">Coba Lagi</button>
</div>

<script>
    // --- EDIT SOAL ANDA DI SINI NANTI ---
    const quizData = [
        {
            question: "Manakah kalimat di bawah ini yang menggunakan majas personifikasi?",
            options: [
                "Suaranya menggelegar membelah angkasa.",
                "Pena itu menari-nari di atas kertas putih.",
                "Wajahnya pucat pasi seperti mayat.",
                "Keringatnya menganak sungai."
            ],
            correct: 1 // Index jawaban benar (dimulai dari 0, jadi 1 = Pena itu menari-nari...)
        },
        {
            question: "Struktur teks eksposisi yang berisi simpulan atau penegasan kembali tesis disebut...",
            options: ["Argumentasi", "Pernyataan pendapat", "Penegasan ulang", "Orientasi"],
            correct: 2 
        }
    ];
    // -------------------------------

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const submitBtn = document.getElementById('submit');
    const quizEl = document.getElementById('quiz');
    const resultEl = document.getElementById('result');
    const scoreEl = document.getElementById('score');
    const totalEl = document.getElementById('total');

    let currentQuiz = 0;
    let score = 0;
    let selectedOption = null;

    function loadQuiz() {
        selectedOption = null;
        optionsEl.innerHTML = '';
        
        const currentQuizData = quizData[currentQuiz];
        questionEl.innerText = currentQuizData.question;

        currentQuizData.options.forEach((option, index) => {
            const li = document.createElement('li');
            li.innerText = option;
            li.addEventListener('click', () => selectOption(li, index));
            optionsEl.appendChild(li);
        });
    }

    function selectOption(li, index) {
        const allOptions = document.querySelectorAll('.options li');
        allOptions.forEach(opt => opt.classList.remove('selected'));
        li.classList.add('selected');
        selectedOption = index;
    }

    submitBtn.addEventListener('click', () => {
        if (selectedOption !== null) {
            if (selectedOption === quizData[currentQuiz].correct) {
                score++;
            }
            currentQuiz++;

            if (currentQuiz < quizData.length) {
                loadQuiz();
            } else {
                quizEl.style.display = 'none';
                resultEl.style.display = 'block';
                scoreEl.innerText = score;
                totalEl.innerText = quizData.length;
            }
        } else {
            alert('Silakan pilih jawaban terlebih dahulu!');
        }
    });

    loadQuiz();
</script>

</body>
</html>

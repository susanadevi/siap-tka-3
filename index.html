<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAP TKA Seri 03 Bahasa Indonesia SMP</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#6E1F26', bgcream: '#F8F3EA', accent: '#D8A5A5', secondary: '#C9A96A' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], allura: ['Allura', 'cursive'] }
                }
            }
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        #cbt-app-root { position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100dvh !important; z-index: 999999 !important; background-color: #F8F3EA !important; overflow: hidden !important; display: block !important; }
        body, html { margin: 0 !important; padding: 0 !important; overflow: hidden !important; height: 100% !important; }
        .page { display: none; opacity: 0; transition: opacity 0.3s ease-in-out; }
        .page.active { display: flex; opacity: 1; height: 100%; }
        .opt-btn.selected { background-color: #C9A96A !important; color: white !important; border-color: #C9A96A !important; }
    </style>
</head>
<body>

    <div id="cbt-app-root" class="text-gray-800">
        <!-- OVERLAY BEKU -->
        <div id="freeze-overlay" class="hidden fixed inset-0 bg-black/95 z-[999999] flex flex-col items-center justify-center text-white p-6">
            <h1 class="text-4xl font-extrabold text-red-500 mb-4 tracking-widest uppercase">UJIAN DIBEKUKAN</h1>
            <p class="text-lg mb-6 text-center">Pelanggaran terdeteksi (pindah layar).<br>Buka dalam:</p>
            <div id="freeze-timer" class="text-6xl font-black text-secondary">05:00</div>
        </div>

        <!-- 1. LANDING PAGE -->
        <div id="page-landing" class="page active flex-col items-center justify-center p-4">
            <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full border-t-8 border-primary text-center">
                <h1 class="text-3xl font-extrabold text-primary tracking-tight">SIAP TKA</h1>
                <h2 class="text-lg font-bold text-secondary mt-1">Bahasa Indonesia SMP</h2>
                <div class="flex flex-col gap-3 mt-8">
                    <button onclick="navigate('page-siswa-auth')" class="w-full py-3 px-4 font-bold rounded-xl text-white bg-secondary hover:bg-yellow-600 shadow-md">Masuk sebagai Siswa</button>
                    <button onclick="navigate('page-guru-auth')" class="w-full py-3 px-4 font-bold rounded-xl text-white bg-primary hover:bg-red-900 shadow-md">Portal Guru</button>
                </div>
            </div>
        </div>

        <!-- 2. LOGIN GURU -->
        <div id="page-guru-auth" class="page flex-col items-center justify-center p-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border-l-8 border-primary">
                <button onclick="navigate('page-landing')" class="text-gray-400 text-sm font-semibold mb-4">← Kembali</button>
                <h2 class="text-2xl font-extrabold text-primary mb-6">Portal Guru</h2>
                <form onsubmit="handleGuruLogin(event)" class="space-y-4">
                    <input type="text" id="guru-nama" placeholder="Nama Guru" required class="w-full px-4 py-2 border rounded-xl">
                    <input type="password" id="guru-pin" placeholder="PIN Rahasia" required class="w-full px-4 py-2 border rounded-xl">
                    <button type="submit" id="btn-login-guru" class="w-full py-3 bg-primary text-white font-bold rounded-xl">Masuk Dasbor</button>
                </form>
            </div>
        </div>

        <!-- 3. LOGIN SISWA -->
        <div id="page-siswa-auth" class="page flex-col items-center justify-center p-4">
            <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border-r-8 border-secondary">
                <button onclick="navigate('page-landing')" class="text-gray-400 text-sm font-semibold mb-4">← Kembali</button>
                <h2 class="text-2xl font-extrabold text-primary mb-4">Mulai Ujian</h2>
                <form onsubmit="handleSiswaLogin(event)" class="space-y-3">
                    <input type="text" id="siswa-nama" placeholder="Nama Lengkap" required class="w-full px-4 py-2 border rounded-xl">
                    <input type="text" id="siswa-kelas" placeholder="Kelas" required class="w-full px-4 py-2 border rounded-xl">
                    <input type="text" id="siswa-sekolah" placeholder="Asal Sekolah" required class="w-full px-4 py-2 border rounded-xl">
                    <input type="text" id="siswa-token" placeholder="Token Ujian" required class="w-full px-4 py-2 border rounded-xl uppercase font-mono">
                    <button type="submit" id="btn-login-siswa" class="w-full py-3 bg-secondary text-white font-bold rounded-xl mt-4">Validasi Token & Ambil Soal</button>
                </form>
            </div>
        </div>

        <!-- 4. RUANG UJIAN (ENGINE CBT) -->
        <div id="page-exam" class="page flex-col w-full bg-bgcream h-full">
            <div class="bg-primary text-white p-4 shadow-lg flex justify-between items-center shrink-0">
                <div class="font-bold">SOAL NO. <span id="exam-no" class="text-xl text-yellow-300 ml-1">1</span></div>
                <div id="exam-student-name" class="font-bold text-sm">Siswa</div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 md:p-8 flex justify-center">
                <div class="max-w-3xl w-full flex flex-col gap-4">
                    
                    <!-- Kotak Wacana/Teks -->
                    <div id="box-wacana" class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 text-sm md:text-base text-justify hidden">
                        <!-- Teks Wacana akan masuk ke sini -->
                    </div>

                    <!-- Kotak Pertanyaan -->
                    <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-primary">
                        <p id="teks-pertanyaan" class="text-base md:text-lg font-semibold text-gray-800">Memuat soal...</p>
                    </div>

                    <!-- Pilihan Ganda -->
                    <div class="flex flex-col gap-3 mt-2" id="box-opsi">
                        <button onclick="pilihJawaban('A')" id="btn-opt-A" class="opt-btn w-full text-left p-4 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 transition-colors font-medium">A. <span id="teks-opt-A"></span></button>
                        <button onclick="pilihJawaban('B')" id="btn-opt-B" class="opt-btn w-full text-left p-4 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 transition-colors font-medium">B. <span id="teks-opt-B"></span></button>
                        <button onclick="pilihJawaban('C')" id="btn-opt-C" class="opt-btn w-full text-left p-4 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 transition-colors font-medium">C. <span id="teks-opt-C"></span></button>
                        <button onclick="pilihJawaban('D')" id="btn-opt-D" class="opt-btn w-full text-left p-4 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 transition-colors font-medium">D. <span id="teks-opt-D"></span></button>
                    </div>
                </div>
            </div>

            <!-- Navigasi Bawah -->
            <div class="bg-white p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] flex justify-between items-center shrink-0">
                <button onclick="soalSebelumnya()" id="btn-prev" class="px-6 py-2 bg-gray-200 text-gray-700 font-bold rounded-lg invisible">Kembali</button>
                <button onclick="soalSelanjutnya()" id="btn-next" class="px-6 py-2 bg-primary text-white font-bold rounded-lg">Selanjutnya</button>
                <button onclick="selesaiUjian()" id="btn-finish" class="px-6 py-2 bg-green-600 text-white font-bold rounded-lg hidden">Selesai & Kirim</button>
            </div>
        </div>

        <!-- 5. DASBOR GURU -->
        <div id="page-dashboard" class="page flex-col w-full bg-gray-900 text-white p-4">
            <div class="flex justify-between items-start mb-6">
                <div><h2 class="text-2xl font-black text-secondary">DASBOR GURU</h2><p class="text-gray-400 text-sm" id="dash-subtitle">Token: -</p></div>
                <button onclick="navigate('page-landing')" class="bg-red-700 px-4 py-2 rounded-lg text-sm font-bold">Keluar</button>
            </div>
            <div class="bg-gray-800 rounded-xl flex-1 overflow-hidden flex flex-col">
                <div class="p-3 bg-gray-900 font-bold text-sm text-gray-400">Live Monitor</div>
                <div class="overflow-y-auto p-2 flex-1">
                    <table class="w-full text-left text-sm"><tbody id="tabel-log-admin"></tbody></table>
                </div>
            </div>
        </div>

    </div>

    <!-- LOGIKA JAVASCRIPT APLIKASI -->
    <script>
        const APP_CONFIG = {
            GAS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyApbEUWAadq_O7u346AwuCG-oeSTWJZ-C9gGekgr1hJp4TrenKXdyc-awED6gEd01VcQ/exec", // Ganti dengan URL Deploy baru jika berubah
            APP_SECRET_TOKEN: "MISI RAHASIA DEVI",
        };

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAozoqP9tSqDj8ZL2gCiYWygmAteZ45qPA", 
            authDomain: "siap-tka-3.firebaseapp.com",
            databaseURL: "https://siap-tka-3-default-rtdb.firebaseio.com", 
            projectId: "siap-tka-3"
        };

        let db = null; try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); } catch(e) {}
        
        let bankSoal = [];
        let jawabanSiswa = {};
        let soalSekarang = 0;
        let currentSessionId = null; 

        function navigate(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        async function fetchServer(payloadData) {
            payloadData.tokenAPI = APP_CONFIG.APP_SECRET_TOKEN;
            return await fetch(APP_CONFIG.GAS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams(payloadData) });
        }

        // ================= MESIN CBT (FRONTEND) =================
        async function handleSiswaLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login-siswa'); btn.innerText = "Mengambil Soal..."; btn.disabled = true;
            const t = document.getElementById('siswa-token').value.toUpperCase();
            
            try {
                // 1. Cek Token
                let res = await fetchServer({ aksi: 'cekTokenGuru', tokenGuru: t });
                let hasil = await res.json();
                
                if (hasil.status === 'sukses') {
                    // 2. Ambil Soal dari Google Sheets
                    res = await fetchServer({ aksi: 'getSoal' });
                    let hasilSoal = await res.json();
                    
                    if (hasilSoal.status === 'sukses' && hasilSoal.data.length > 0) {
                        bankSoal = hasilSoal.data;
                        jawabanSiswa = {};
                        soalSekarang = 0;
                        mulaiSesiFirebase(document.getElementById('siswa-nama').value, t);
                        tampilkanSoal();
                        navigate('page-exam');
                    } else { alert("Data soal kosong atau gagal diambil."); }
                } else alert(hasil.pesan);
            } catch(err) { alert("Gangguan jaringan/Skrip URL Salah."); } finally { btn.innerText = "Validasi Token & Ambil Soal"; btn.disabled = false; }
        }

        function tampilkanSoal() {
            const soal = bankSoal[soalSekarang];
            document.getElementById('exam-no').innerText = (soalSekarang + 1);
            
            // Wacana
            const boxWacana = document.getElementById('box-wacana');
            if (soal.wacana && soal.wacana.trim() !== "") {
                boxWacana.innerHTML = soal.wacana.replace(/\n/g, '<br>');
                boxWacana.classList.remove('hidden');
            } else { boxWacana.classList.add('hidden'); }

            // Pertanyaan & Opsi
            document.getElementById('teks-pertanyaan').innerText = soal.pertanyaan;
            document.getElementById('teks-opt-A').innerText = soal.A;
            document.getElementById('teks-opt-B').innerText = soal.B;
            document.getElementById('teks-opt-C').innerText = soal.C;
            document.getElementById('teks-opt-D').innerText = soal.D;

            // Hapus seleksi sebelumnya
            document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
            // Kembalikan seleksi jika sudah dijawab
            if (jawabanSiswa[soalSekarang]) {
                document.getElementById('btn-opt-' + jawabanSiswa[soalSekarang]).classList.add('selected');
            }

            // Navigasi Tombol
            document.getElementById('btn-prev').style.visibility = (soalSekarang === 0) ? 'hidden' : 'visible';
            
            if (soalSekarang === bankSoal.length - 1) {
                document.getElementById('btn-next').classList.add('hidden');
                document.getElementById('btn-finish').classList.remove('hidden');
            } else {
                document.getElementById('btn-next').classList.remove('hidden');
                document.getElementById('btn-finish').classList.add('hidden');
            }
        }

        function pilihJawaban(opsi) {
            jawabanSiswa[soalSekarang] = opsi;
            document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('btn-opt-' + opsi).classList.add('selected');
        }

        function soalSelanjutnya() { if (soalSekarang < bankSoal.length - 1) { soalSekarang++; tampilkanSoal(); } }
        function soalSebelumnya() { if (soalSekarang > 0) { soalSekarang--; tampilkanSoal(); } }

        async function selesaiUjian() {
            if(Object.keys(jawabanSiswa).length < bankSoal.length) {
                if(!confirm("Masih ada soal yang belum dijawab! Yakin ingin selesai?")) return;
            } else {
                if(!confirm("Anda yakin ingin menyelesaikan ujian ini?")) return;
            }

            const btn = document.getElementById('btn-finish'); btn.innerText = "Mengirim..."; btn.disabled = true;
            
            // Hitung Nilai Otomatis
            let benar = 0;
            for(let i=0; i<bankSoal.length; i++){
                if(jawabanSiswa[i] && jawabanSiswa[i].toUpperCase() === bankSoal[i].kunci.toUpperCase()){
                    benar++;
                }
            }
            let nilaiAkhir = Math.round((benar / bankSoal.length) * 100);

            try {
                let statusCurang = "Tidak";
                if(db && currentSessionId) {
                    const snap = await db.ref('sessions/' + currentSessionId).once('value');
                    if(snap.val() && snap.val().pelanggaran > 0) statusCurang = `Ya (${snap.val().pelanggaran}x)`;
                }
                const res = await fetchServer({ 
                    aksi: 'simpanNilai', tokenGuru: document.getElementById('siswa-token').value, 
                    nama: document.getElementById('siswa-nama').value, kelas: document.getElementById('siswa-kelas').value, 
                    sekolah: document.getElementById('siswa-sekolah').value, nilai: nilaiAkhir, curang: statusCurang 
                });
                let hasil = await res.json();
                if (hasil.status === 'sukses') {
                    alert(`Ujian Selesai! Nilai Anda: ${nilaiAkhir}`); 
                    if(db && currentSessionId) { db.ref('sessions/' + currentSessionId).remove(); window.onblur = null; }
                    navigate('page-landing');
                } else alert("Gagal mengirim nilai.");
            } catch (err) { alert("Gangguan koneksi."); } finally { btn.innerText = "Selesai & Kirim"; btn.disabled = false; }
        }

        // ================= FIREBASE ANTI-CURANG =================
        function mulaiSesiFirebase(nama, tokenGuru) {
            if(!db) return;
            currentSessionId = "siswa_" + Date.now();
            document.getElementById('exam-student-name').innerText = nama;
            
            db.ref('sessions/' + currentSessionId).set({ id: currentSessionId, nama: nama, kelas: document.getElementById('siswa-kelas').value, tokenGuru: tokenGuru, status: 'AKTIF', pelanggaran: 0 });
            db.ref('sessions/' + currentSessionId).on('value', (snapshot) => {
                const data = snapshot.val();
                if(data && data.status === 'DIBEKUKAN') { document.getElementById('freeze-overlay').classList.remove('hidden'); } 
                else { document.getElementById('freeze-overlay').classList.add('hidden'); }
            });
            window.onblur = function() {
                if(currentSessionId && db) { db.ref('sessions/' + currentSessionId).update({ status: 'DIBEKUKAN', pelanggaran: firebase.database.ServerValue.increment(1) });
                    setTimeout(() => { if(db && currentSessionId) db.ref('sessions/' + currentSessionId).update({ status: 'AKTIF' }); }, 300000); }
            };
        }

        // ================= DASHBOARD GURU =================
        async function handleGuruLogin(e) {
            e.preventDefault();
            const token = document.getElementById('guru-pin').value; // Simulasi bypass dashboard
            document.getElementById('dash-subtitle').innerText = "Token Pemantauan Aktif";
            navigate('page-dashboard');
            if(db) {
                db.ref('sessions').on('value', (snapshot) => {
                    const tbody = document.getElementById('tabel-log-admin'); tbody.innerHTML = '';
                    const data = snapshot.val();
                    if(!data) { tbody.innerHTML = '<tr><td class="text-center py-4">Kosong</td></tr>'; return; }
                    Object.keys(data).forEach(key => {
                        const s = data[key]; const fr = s.status === 'DIBEKUKAN';
                        tbody.innerHTML += `<tr class="border-b border-gray-700">
                            <td class="px-2 py-2">${s.nama} (${s.kelas}) <br> <span class="${fr ? 'text-red-400' : 'text-green-400'}">${s.status}</span></td></tr>`;
                    });
                });
            }
        }
    </script>
</body>
</html>
